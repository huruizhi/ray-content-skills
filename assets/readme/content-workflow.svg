<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="390" viewBox="0 0 1200 390" role="img" aria-labelledby="title desc">
  <title id="title">Ray Content Skills workflow</title>
  <desc id="desc">Plan and draft a technical article, optimize it with ray-tone, then use Lieflat to detect issues, review suggestions, and recheck accepted edits before choosing GitHub Pages publication or a WeChat draft. Obsidian Markdown is an independent note-writing skill.</desc>
  <rect width="1200" height="390" fill="#F5F2EA"/>
  <g font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" fill="#18212A">
    <text x="58" y="52" font-size="15" font-weight="600" letter-spacing="2" fill="#6C7780">RAY CONTENT SKILLS / ARTICLE WORKFLOW</text>
    <text x="58" y="101" font-size="34" font-weight="650">从选题到成稿，再选择发布去向</text>
    <text x="58" y="130" font-size="17" fill="#6C7780">先起草、整体优化，再检测、确认与复测；两个发布目标彼此独立。</text>
  </g>
  <g stroke="#C8CED1" stroke-width="1">
    <line x1="58" y1="158" x2="1142" y2="158"/>
    <line x1="316" y1="220" x2="352" y2="220"/>
    <path d="M606 220 H646 V190 H674 M646 220 V258 H674" fill="none"/>
  </g>
  <g font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
    <g transform="translate(58 178)">
      <text x="0" y="13" font-size="12" font-family="SFMono-Regular, Consolas, monospace" fill="#6C7780">01 / PLAN &amp; DRAFT</text>
      <text x="0" y="47" font-size="20" font-weight="650" fill="#18212A">ray-technical-writer</text>
      <text x="0" y="76" font-size="15" fill="#365F78">访谈 · 提纲 · 起草</text>
    </g>
    <g transform="translate(352 178)">
      <text x="0" y="13" font-size="12" font-family="SFMono-Regular, Consolas, monospace" fill="#6C7780">02 / EDIT</text>
      <text x="0" y="47" font-size="21" font-weight="650" fill="#18212A">ray-tone</text>
      <text x="0" y="76" font-size="17" font-weight="600" fill="#18212A">→ lieflat-less-ai-tone</text>
      <text x="0" y="102" font-size="14" fill="#365F78">整体优化 → 检测 · 确认 · 复测</text>
    </g>
    <g transform="translate(684 168)">
      <text x="0" y="13" font-size="12" font-family="SFMono-Regular, Consolas, monospace" fill="#6C7780">03A / BLOG</text>
      <text x="0" y="43" font-size="19" font-weight="650" fill="#18212A">ray-publish-github</text>
      <text x="0" y="67" font-size="14" fill="#365F78">部署到 GitHub Pages</text>
    </g>
    <g transform="translate(684 237)">
      <text x="0" y="13" font-size="12" font-family="SFMono-Regular, Consolas, monospace" fill="#6C7780">03B / WECHAT</text>
      <text x="0" y="42" font-size="18" font-weight="650" fill="#18212A">ray-post-to-wechat</text>
      <text x="0" y="66" font-size="14" fill="#365F78">保存到公众号草稿箱</text>
    </g>
  </g>
  <g fill="none" stroke="#365F78" stroke-width="2">
    <path d="M336 214 l8 6 -8 6 M630 214 l8 6 -8 6 M666 184 l8 6 -8 6 M666 252 l8 6 -8 6"/>
  </g>
  <line x1="58" y1="330" x2="1142" y2="330" stroke="#C8CED1" stroke-width="1"/>
  <g font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
    <text x="58" y="362" font-size="15" font-weight="650" fill="#18212A">独立使用</text>
    <text x="151" y="362" font-size="14" fill="#365F78">ray-obsidian-markdown · 编辑 Obsidian 笔记</text>
    <text x="1142" y="362" text-anchor="end" font-size="13" fill="#6C7780">作者确认发布动作；微信草稿不等于群发。</text>
  </g>
</svg>
